<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exemple d'intégration Nuée</title>
<style>
  body{margin:0;background:#101114;color:#e8e8ec;font-family:system-ui,sans-serif}
  header,section{max-width:1100px;margin:0 auto;padding:32px 20px}
  h1{font-weight:300;letter-spacing:.3em;text-transform:uppercase;font-size:20px;margin:0 0 8px}
  p{opacity:.7;line-height:1.6;max-width:62ch}
  .hero{width:100%;height:520px}
  .band{background:linear-gradient(120deg,#1d2a4a,#3a1f4d);border-radius:12px;overflow:hidden}
  .band .hero{height:380px}
</style>
</head>
<body>
<header>
  <h1>Ma page</h1>
  <p>La scène ci-dessous est un simple &lt;div&gt; rempli par le script. Elle réagit au survol de la souris et se met en pause quand elle sort de l'écran.</p>
</header>

<section>
  <div class="hero" data-nuee="scene.json"></div>
</section>

<section>
  <p>Même scène avec un fond transparent, posée sur un dégradé de ta page :</p>
  <div class="band"><div class="hero" data-nuee="nuee-scene.json" data-nuee-transparent="true" data-nuee-density="90000"></div></div>
</section>

<script src="assets/js/exportEmbed.js"></script>
</body>
</html>
